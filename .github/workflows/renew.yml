name: Auto Renew FridayDev Service

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装并启动 sing-box 住宅代理
      - name: Setup Sing-box Residential Proxy
        env:
          PROXY_CONFIG: ${{ secrets.PROXY_CONFIG }}
        run: |
          # 下载并安装 sing-box
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.0/sing-box-1.9.0-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/
          rm -rf sing-box*

          # 保存节点配置
          echo "$PROXY_CONFIG" > node.json

          # 构造完整的本地 SOCKS5 客户端配置
          python3 -c '
          import json
          with open("node.json") as f:
              outbound = json.load(f)
          outbound["tag"] = "proxy"
          
          config = {
              "inbounds": [{
                  "type": "socks",
                  "tag": "socks-in",
                  "listen": "127.0.0.1",
                  "listen_port": 1080
              }],
              "outbounds": [outbound]
          }
          with open("config.json", "w") as f:
              json.dump(config, f, indent=2)
          '

          # 后台运行 sing-box
          sing-box run -c config.json > singbox.log 2>&1 &
          sleep 3

          # 测试代理连通性及出口 IP
          echo "🌐 测试住宅代理出口 IP..."
          curl -x socks5://127.0.0.1:1080 https://api.ipify.org || echo "代理启动中..."

      # 2. 安装 Python 及环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright camoufox
          playwright install-deps
          python -m camoufox fetch

      # 3. 在虚拟桌面上运行自动化脚本
      - name: Run Auto Renew Script
        env:
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      # 4. 上传截图便于检查
      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshot
          path: |
            after_click.png
            cf_clicked.png
            result.png
