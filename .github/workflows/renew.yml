name: Auto Renew FridayDev Service

on:
  workflow_dispatch:

jobs:
  renew:
    # 锁定 ubuntu-22.04 环境，完美兼容 WARP 与 Camoufox
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 开启 Cloudflare WARP 官方网络出口
      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright camoufox
          playwright install-deps
          python -m camoufox fetch

      - name: Run Auto Renew Script
        env:
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          python renew.py

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshot
          path: |
            after_click.png
            cf_clicked.png
            result.png
