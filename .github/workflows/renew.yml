name: Auto Renew FridayDev Service

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 开启 Cloudflare WARP 出口
      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright camoufox playwright-captcha
          playwright install-deps
          python -m camoufox fetch

      - name: Run Auto Renew Script (in Virtual Display)
        env:
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshot
          path: |
            after_click.png
            cf_clicked.png
            result.png
